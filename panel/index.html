<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TS Zenit · Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath d=%22M50 8 L58 42 L92 50 L58 58 L50 92 L42 58 L8 50 L42 42 Z%22 fill=%22%23F5A524%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
:root{color-scheme:dark;--bg:#0B1A33;--bg-deep:#081428;--surface:#11264B;--surface-2:#17315C;--line:#2A4775;--cafe:#6B4429;--cafe-2:#84573A;--latte:#D8A878;--ink:#F2F4F9;--muted:#B7C3DA;--gold:#F5A524;--ok:#7FD4A8;--warn:#F2C46D;--bad:#F08A8A;
--f-display:"Poppins","Avenir Next","Segoe UI",system-ui,sans-serif;--f-body:"Source Serif 4",Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-deep);z-index:30}
a{color:var(--latte)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--latte);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-size:.9em;letter-spacing:.03em}
.btn{font:600 14px var(--f-display);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--cafe);color:var(--ink);min-height:40px}
.btn:hover{background:var(--cafe-2)} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line)} .btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.bad{background:transparent;border:1px solid #6b3a3a;color:var(--bad)}
input,select{font:16px var(--f-body);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{font:600 13px var(--f-display);color:var(--muted);display:block;margin-bottom:6px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
#login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:14px}
#login .logo svg{width:180px;height:auto}
.err{color:var(--bad);font:600 14px var(--f-display)}
.check{display:flex;gap:8px;align-items:center;font:14px var(--f-display);color:var(--muted)} .check input{width:auto}
/* app */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,20,40,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
header.top .logo svg{width:132px;height:auto;display:block}
header.top .sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.tab{font:600 14px var(--f-display);background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--surface-2);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--gold);color:#1b1305;font-size:12px;line-height:20px;text-align:center}
main{padding-block:18px 48px;display:grid;gap:18px}
main>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font:700 24px var(--f-display)} .kpi span{font:13px var(--f-display);color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.item .row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:baseline}
.item h3{font-size:16px}
.item .meta{font:13px var(--f-display);color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 12px var(--f-display);padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.w{color:var(--warn);border-color:#6b5a2a} .chip.o{color:var(--ok);border-color:#2f6b52} .chip.b{color:var(--bad);border-color:#6b3a3a}
.box{background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.code{font:600 20px var(--f-mono);letter-spacing:.08em;color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);font-family:var(--f-display)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font:14px var(--f-display)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap} th{color:var(--muted);font-weight:600;background:var(--bg-deep)}
td.r,th.r{text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.errs{font:13px/1.6 var(--f-mono);color:var(--muted);columns:2 180px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 14px var(--f-display);padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);z-index:40}
.note{font:13px var(--f-display);color:var(--muted)}
</style></head><body>

<section id="login">
  <form id="lf" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 400 100" role="img" aria-label="TS Zenit" xmlns="http://www.w3.org/2000/svg"><g><path d="M10 86 A44 44 0 0 1 98 86" fill="none" stroke="#F2F4F9" stroke-width="6"/><rect x="33" y="70" width="9" height="16" rx="1.5" fill="#8E96E0"/><rect x="49.5" y="60" width="9" height="26" rx="1.5" fill="#B9C0F2"/><rect x="66" y="56" width="9" height="30" rx="1.5" fill="#F2F4F9"/><path d="M54 4 L58.6 19.4 L74 24 L58.6 28.6 L54 44 L49.4 28.6 L34 24 L49.4 19.4 Z" fill="#F5A524"/><rect x="2" y="86" width="104" height="4.5" rx="2.2" fill="#F2F4F9"/></g><text x="122" y="61" font-family="Poppins, 'Avenir Next', 'Segoe UI', sans-serif" font-size="46" letter-spacing="2.5" fill="#F2F4F9"><tspan font-weight="500">TS</tspan><tspan font-weight="700" dx="10">ZENIT</tspan></text><text x="124" y="87" font-family="Poppins, 'Avenir Next', 'Segoe UI', sans-serif" font-weight="600" font-size="14.5" letter-spacing="5.0" fill="#D8A878">HAZLO REALIDAD</text></svg></div>
    <h1 style="font-size:20px">Panel del creador</h1>
    <div><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="rem"> Recordar en este dispositivo</label>
    <p class="err" id="lerr" hidden></p>
    <button class="btn" id="lgo">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <a class="logo" href="../" aria-label="Ir a la tienda"><svg viewBox="0 0 400 100" role="img" aria-label="TS Zenit" xmlns="http://www.w3.org/2000/svg"><g><path d="M10 86 A44 44 0 0 1 98 86" fill="none" stroke="#F2F4F9" stroke-width="6"/><rect x="33" y="70" width="9" height="16" rx="1.5" fill="#8E96E0"/><rect x="49.5" y="60" width="9" height="26" rx="1.5" fill="#B9C0F2"/><rect x="66" y="56" width="9" height="30" rx="1.5" fill="#F2F4F9"/><path d="M54 4 L58.6 19.4 L74 24 L58.6 28.6 L54 44 L49.4 28.6 L34 24 L49.4 19.4 Z" fill="#F5A524"/><rect x="2" y="86" width="104" height="4.5" rx="2.2" fill="#F2F4F9"/></g><text x="122" y="61" font-family="Poppins, 'Avenir Next', 'Segoe UI', sans-serif" font-size="46" letter-spacing="2.5" fill="#F2F4F9"><tspan font-weight="500">TS</tspan><tspan font-weight="700" dx="10">ZENIT</tspan></text><text x="124" y="87" font-family="Poppins, 'Avenir Next', 'Segoe UI', sans-serif" font-weight="600" font-size="14.5" letter-spacing="5.0" fill="#D8A878">HAZLO REALIDAD</text></svg></a><span class="sp"></span>
    <button class="btn ghost sm" id="reload">Actualizar</button>
    <button class="btn ghost sm" id="out">Salir</button>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="pagos" aria-selected="true">Pagos<span class="badge" id="bP" hidden></span></button>
    <button class="tab" role="tab" data-t="hojas">Hojas<span class="badge" id="bH" hidden></span></button>
    <button class="tab" role="tab" data-t="codigos">Códigos</button>
  </nav></div></header>

  <main class="wrap">
    <div class="kpis" id="kpis"></div>
    <p class="note" id="sync"></p>

    <section id="t-pagos" class="list"></section>
    <section id="t-hojas" class="list" hidden></section>
    <section id="t-codigos" hidden>
      <div class="box" style="margin-bottom:16px">
        <h3 style="font-size:16px">Entregar un código sin aviso de pago</h3>
        <p class="note">Para regalos, pagos por transferencia o compradores que te escribieron directo. Queda anotado en la hoja «Pagos».</p>
        <div class="grid2">
          <div><label for="mProd">Producto</label><select id="mProd"></select></div>
          <div><label for="mNom">Nombre</label><input id="mNom" autocomplete="off"></div>
          <div><label for="mMail">Correo</label><input id="mMail" type="email" autocomplete="off"></div>
          <div><label for="mPre">Monto recibido</label><input id="mPre" inputmode="numeric"></div>
        </div>
        <div class="bar"><button class="btn" id="mGo">Enviar código por correo</button><span class="note" id="mInfo"></span></div>
      </div>
      <div class="tbl"><table><thead><tr><th>Producto</th><th class="r">Precio</th><th class="r">Entregados</th><th class="r">Libres</th></tr></thead><tbody id="tC"></tbody></table></div>
    </section>
  </main>
</div>
<div id="toast" hidden role="status"></div>

async function abrir(pw) {

  const base = await crypto.subtle.importKey("raw", TE.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: u.slice(0, 16), iterations: ITER }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(16, 28) }, key, u.slice(28));
  D = JSON.parse(new TextDecoder().decode(plain));
  const h = await crypto.subtle.digest("SHA-256", TE.encode("tsz-admin:" + pw));
  TOKEN = [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function api(accion, extra) {
  const r = await fetch(D.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ tipo: "admin", token: TOKEN, accion }, extra || {})) });
  let j; try { j = await r.json(); } catch (e) { throw new Error("red"); }
  if (!j.ok) throw new Error(j.error || "version");
  return j;
}
/* ---------- catálogo ---------- */
const ejeDe = id => D.ejes.find(e => e.id === id);
const ejeDeGuia = c => D.ejes.find(e => e.guias.includes(c));
const precioDe = p => { const e = ejeDe(p); return e ? Math.max(PRECIO, e.guias.length * PRECIO - DESC) : PRECIO; };
const nombreDe = p => { const e = ejeDe(p); return e ? `Eje completo · ${e.nombre}` : (D.guias[p] ? D.guias[p].t : p); };
/* Pagos: Fecha, Producto, Título, Precio, Nombre, Correo, Operación, Código, Estado, Entregado el */
const usados = () => new Set(P.map(r => String(r.v[7] || "").trim()).filter(Boolean));
const libre = p => { const u = usados(); return (D.codes[p] || []).find(c => !u.has(c)); };

function kpis() {
  const ent = P.filter(r => r.v[8] === "Entregado");
  const pend = P.filter(r => r.v[8] === "Por verificar").length, hp = H.filter(r => r.v[14] === "Por revisar").length;
  $("#kpis").innerHTML = [
    [ent.length, "ventas entregadas"], [fmt(ent.reduce((s, r) => s + (Number(r.v[3]) || 0), 0)), "ingresos registrados"],
    [pend, "pagos por verificar"], [hp, "hojas por revisar"]].map(([b, s]) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join("");
  const bp = $("#bP"), bh = $("#bH"); bp.textContent = pend; bp.hidden = !pend; bh.textContent = hp; bh.hidden = !hp;
}
const chip = e => `<span class="chip ${/Entregado|Enviado/.test(e) ? "o" : /Rechaz|Repetida/.test(e) ? "b" : "w"}">${esc(e || "—")}</span>`;

function renderPagos() {
  const L = [...P].reverse();
  $("#t-pagos").innerHTML = L.length ? L.map(r => {
    const [f, prod, tit, pre, nom, mail, op, cod, est, entF] = r.v; const pend = est === "Por verificar";
    const prox = pend ? libre(prod) : "";
    return `<article class="item" data-f="${r.fila}">
      <div class="row"><h3>${esc(nom || "(sin nombre)")}</h3>${chip(est)}</div>
      <div class="meta"><span>${esc(tit || nombreDe(prod))}</span><span>${fmt(pre)}</span><span>${fecha(f)}</span></div>
      <div class="meta"><span>${esc(mail)}</span><span>Operación MP: ${esc(op || "—")}</span>${cod ? `<span>Código: <b class="mono">${esc(cod)}</b>${entF ? " · " + fecha(entF) : ""}</span>` : ""}</div>
      ${pend ? `<div class="box"><p class="note">1. Revisa en Mercado Pago que entró un pago de <b>${fmt(pre)}</b> de <b>${esc(nom)}</b>${op ? ` (operación ${esc(op)})` : ""}.<br>2. Si está, envía este código a <b>${esc(mail)}</b>:</p>
        ${prox ? `<div class="code">${prox}</div><div class="acts"><button class="btn" data-ent="${r.fila}" data-c="${prox}">Pago verificado · enviar código</button><button class="btn bad sm" data-rech="${r.fila}">No encuentro el pago</button></div>`
               : `<p class="err">No quedan códigos libres de este producto. Pídeme más.</p>`}</div>` : ""}
    </article>`; }).join("") : `<div class="empty">Aún no hay avisos de pago. Cuando alguien pague y avise, aparece aquí.</div>`;
}
function errores(code, resp) {
  const k = D.claves[code] || ""; const out = [];
  for (let i = 0; i < k.length; i++) if (resp[i] !== k[i]) out.push(`${i + 1}: ${resp[i] === "-" || !resp[i] ? "omitida" : resp[i]} → ${k[i]}`);
  return out;
}
function renderHojas() {
  const seen = {}; H.forEach(r => { const id = r.v[4] + "|" + r.v[2]; seen[id] = (seen[id] || 0) + 1; });
  const L = [...H].reverse();
  $("#t-hojas").innerHTML = L.length ? L.map(r => {
    const [f, folio, code, nom, mail, cur, menor, apo, apoM, resp, ok, mal, om, acc, est] = r.v;
    const n = (D.claves[code] || "").length, e = ejeDeGuia(code);
    const cubre = acc === code || (e && acc === e.id);
    const rep = seen[mail + "|" + code] > 1, errs = errores(code, String(resp || ""));
    const txt = [`Guía: ${D.guias[code] ? D.guias[code].t : code} (${code})`, `Alumno: ${nom} <${mail}>${cur ? " · " + cur : ""}`, `Puntaje: ${ok}/${n}`, `Respuestas: ${resp}`, `Errores (marcó → correcta): ${errs.join("; ") || "ninguno"}`].join("\n");
    return `<article class="item">
      <div class="row"><h3>${esc(nom)}</h3>${chip(est)}<span class="chip">${ok}/${n}</span>${cubre ? "" : `<span class="chip b">sin compra de esta guía</span>`}${rep ? `<span class="chip w">envió esta guía más de una vez</span>` : ""}</div>
      <div class="meta"><span>${esc(D.guias[code] ? D.guias[code].t : code)}</span><span>${fecha(f)}</span><span>Folio ${esc(folio)}</span></div>
      <div class="meta"><span>${esc(mail)}</span>${cur ? `<span>${esc(cur)}</span>` : ""}${menor === "Sí" ? `<span>Menor · apoderado: ${esc(apo)} &lt;${esc(apoM)}&gt;</span>` : ""}</div>
      <details><summary class="note" style="cursor:pointer">${errs.length} errores · ver detalle</summary><div class="errs" style="margin-top:8px">${errs.map(esc).join("<br>") || "Sin errores"}</div></details>
      <div class="acts"><button class="btn ghost sm" data-copy="${esc(txt)}">Copiar para el informe</button>
        ${est === "Enviado" ? `<button class="btn ghost sm" data-hest="${r.fila}" data-v="Por revisar">Volver a «Por revisar»</button>` : `<button class="btn sm" data-hest="${r.fila}" data-v="Enviado">Informe enviado</button>`}</div>
    </article>`; }).join("") : `<div class="empty">Aún no llegan hojas de respuestas.</div>`;
}
function renderCodigos() {
  const u = usados(), rows = [];
  D.ejes.forEach(e => [e.id, ...e.guias].forEach(p => { const all = D.codes[p] || [], used = all.filter(c => u.has(c)).length;
    rows.push(`<tr><td>${esc(nombreDe(p))}${p === e.id ? "" : ` <span class="muted mono">${esc(p)}</span>`}</td><td class="r">${fmt(precioDe(p))}</td><td class="r">${used}</td><td class="r" style="color:${all.length - used < 5 ? "var(--bad)" : "inherit"}">${all.length - used}</td></tr>`); }));
  $("#tC").innerHTML = rows.join("");
  if (!$("#mProd").options.length) {
    $("#mProd").innerHTML = D.ejes.map(e => `<optgroup label="${esc(e.nombre)}"><option value="${e.id}">Eje completo · ${esc(e.nombre)} (${fmt(precioDe(e.id))})</option>${e.guias.map(c => `<option value="${c}">${esc(D.guias[c] ? D.guias[c].t : c)}</option>`).join("")}</optgroup>`).join("");
    $("#mProd").addEventListener("change", mInfo);
  }
  mInfo();
}
function mInfo() { const p = $("#mProd").value, c = libre(p); $("#mPre").placeholder = String(precioDe(p)); $("#mInfo").innerHTML = c ? `Se enviará <b class="mono">${c}</b>` : `<span class="err">Sin códigos libres</span>`; }
function render() { kpis(); renderPagos(); renderHojas(); renderCodigos(); }

async function cargar() {
  $("#sync").textContent = "Cargando datos de la hoja…";
  try { const j = await api("listar"); P = j.pagos; H = j.hojas; render(); $("#sync").textContent = "Actualizado " + new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }) + " · datos reales de «TS Zenit · envíos»"; }
  catch (e) { $("#sync").innerHTML = `<span class="err">${e.message === "auth" ? "El receptor no reconoce la contraseña del panel. Vuelve a pegar el código nuevo en Apps Script y publica una versión nueva." : e.message === "version" ? "Apps Script sigue con el código antiguo: pega el código nuevo y en Implementar › Administrar implementaciones › lápiz elige «Nueva versión»." : "No se pudo conectar con Apps Script. Revisa tu conexión y toca «Actualizar»."}</span>`; render(); }
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.t) { document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === t)); ["pagos", "hojas", "codigos"].forEach(x => $("#t-" + x).hidden = x !== t.dataset.t); return; }
  if (t.dataset.copy != null) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Copiado. Pégamelo en el chat para armar el informe."); } catch (e) { toast("No se pudo copiar"); } return; }
  const busy = async (fn, okMsg) => { t.disabled = true; const x = t.textContent; t.textContent = "Enviando…"; try { await fn(); toast(okMsg); await cargar(); } catch (e) { t.disabled = false; t.textContent = x; toast(e.message === "usado" ? "Ese código ya se entregó. Toca «Actualizar»." : e.message === "auth" ? "Falta actualizar el código en Apps Script." : "No se pudo. Intenta de nuevo."); } };
  if (t.dataset.ent) return busy(() => api("entregar", { fila: +t.dataset.ent, codigo: t.dataset.c }), "Código enviado al comprador");
  if (t.dataset.rech) { if (t.dataset.sure) return busy(() => api("estado", { hoja: "Pagos", fila: +t.dataset.rech, estado: "Rechazado" }), "Marcado como rechazado"); t.dataset.sure = 1; t.textContent = "Toca otra vez para confirmar"; return; }
  if (t.dataset.hest) return busy(() => api("estado", { hoja: "Hojas", fila: +t.dataset.hest, estado: t.dataset.v }), "Estado actualizado");
  if (t.id === "mGo") {
    const p = $("#mProd").value, c = libre(p), nom = $("#mNom").value.trim(), mail = $("#mMail").value.trim();
    if (!c) return toast("No quedan códigos de ese producto");
    if (!nom || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return toast("Escribe nombre y un correo válido");
    return busy(() => api("manual", { producto: p, titulo: nombreDe(p), precio: Number($("#mPre").value.replace(/\D/g, "")) || 0, nombre: nom, correo: mail, codigo: c }).then(() => { $("#mNom").value = $("#mMail").value = $("#mPre").value = ""; }), "Código enviado");
  }
  if (t.id === "reload") return cargar();
  if (t.id === "out") { try { localStorage.removeItem("tsz_admin"); } catch (e) {} location.reload(); }
});
async function entrar(pw, rem) {
  await abrir(pw);
  if (rem) try { localStorage.setItem("tsz_admin", pw); } catch (e) {}
  $("#login").hidden = true; $("#app").hidden = false; render(); cargar();
}
$("#lf").addEventListener("submit", async ev => {
  ev.preventDefault(); const b = $("#lgo"), er = $("#lerr"); er.hidden = true; b.disabled = true; b.textContent = "Abriendo…";
  try { await entrar($("#pw").value.trim(), $("#rem").checked); }
  catch (e) { er.textContent = "Contraseña incorrecta."; er.hidden = false; b.disabled = false; b.textContent = "Entrar"; }
});
(async () => { let pw = null; try { pw = localStorage.getItem("tsz_admin"); } catch (e) {} if (pw) try { await entrar(pw, false); } catch (e) {} })();
</script>
